        let currentNodeId = "intro";
        let isEditMode = false;

        window.onload = function() {
            // 安全讀取本地儲存
            try {
                const savedData = localStorage.getItem('kinmen_rpg_custom_data_v2');
                if (savedData) {
                    gameData = JSON.parse(savedData);
                }
            } catch(e) {
                console.warn("無法存取 LocalStorage，系統將採用記憶體暫存模式！");
            }
            renderNode(currentNodeId);
            setupEventListeners();
        };

        // 渲染畫面
        function renderNode(nodeId) {
            currentNodeId = nodeId;
            const node = gameData[nodeId];

            if (!node) {
                showModal("提示", `找不到關卡代碼: 【${nodeId}】。您可以建立這個新頁面來豐富故事喔！`, [
                    { text: "返回起點", onClick: () => { restartGame(); hideModal(); }, isPrimary: true }
                ]);
                return;
            }

            const bgElement = document.getElementById('game-bg');
            const bgUrl = node.bgImage || presetBgs.kinmen_old;
            bgElement.style.backgroundImage = `url('${bgUrl}')`;

            document.getElementById('node-tag').innerText = node.tag || "金門";
            document.getElementById('story-text').innerHTML = node.story.replace(/\n/g, '<br>');

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            // 動態調整排版：根據按鈕數決定兩三個一排
            const numChoices = node.choices ? node.choices.length : 0;
            if (numChoices === 0) {
                choicesContainer.className = "grid grid-cols-1 w-full pb-2";
            } else if (numChoices === 1) {
                choicesContainer.className = "grid grid-cols-1 w-full pb-2";
            } else if (numChoices === 2) {
                choicesContainer.className = "grid grid-cols-2 gap-2.5 w-full pb-2";
            } else if (numChoices === 3) {
                choicesContainer.className = "grid grid-cols-3 gap-2.5 w-full pb-2";
            } else {
                // 超過 3 個按鈕，自動在手機上雙排，寬屏上三排
                choicesContainer.className = "grid grid-cols-2 sm:grid-cols-3 gap-2.5 w-full pb-2";
            }

            if (numChoices > 0) {
                node.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    // 精緻置中短按鈕樣式
                    btn.className = "w-full bg-black/75 hover:bg-amber-600 border border-amber-500/20 hover:border-amber-500 text-gray-200 hover:text-white font-medium py-3 px-2 rounded-xl transition text-[11px] sm:text-xs backdrop-blur-md shadow-md text-center flex justify-center items-center active:scale-[0.98] min-h-[44px]";
                    btn.innerHTML = `<span class="truncate">${choice.text}</span>`;
                    btn.onclick = () => {
                        renderNode(choice.targetId);
                    };
                    choicesContainer.appendChild(btn);
                });
            } else {
                const btn = document.createElement('button');
                btn.className = "w-full bg-red-900/60 hover:bg-red-800 border border-red-500/30 text-white font-medium py-3 px-4 rounded-xl transition text-xs sm:text-sm backdrop-blur-md text-center active:scale-[0.98]";
                btn.innerText = "✦ 重回故事起點";
                btn.onclick = restartGame;
                choicesContainer.appendChild(btn);
            }

            if (isEditMode) {
                loadNodeToEditor(nodeId);
            }
        }

        function restartGame() {
            renderNode("intro");
        }

        function setupEventListeners() {
            const btnToggleEdit = document.getElementById('btn-toggle-edit');
            const btnCloseEditor = document.getElementById('btn-close-editor');
            const drawer = document.getElementById('editor-drawer');

            btnToggleEdit.onclick = () => {
                isEditMode = !isEditMode;
                if (isEditMode) {
                    drawer.classList.remove('translate-x-full');
                    drawer.classList.remove('hidden');
                    loadNodeToEditor(currentNodeId);
                    document.getElementById('edit-btn-text').innerText = "📖 關閉編輯器";
                } else {
                    drawer.classList.add('translate-x-full');
                    setTimeout(() => drawer.classList.add('hidden'), 300);
                    document.getElementById('edit-btn-text').innerText = "⚙️ 進入編輯器";
                }
            };

            btnCloseEditor.onclick = () => {
                isEditMode = false;
                drawer.classList.add('translate-x-full');
                setTimeout(() => drawer.classList.add('hidden'), 300);
                document.getElementById('edit-btn-text').innerText = "⚙️ 進入編輯器";
            };
        }

        // ================= 編輯器管理 =================

        function loadNodeToEditor(nodeId) {
            const node = gameData[nodeId];
            if (!node) return;

            document.getElementById('edit-node-id').value = nodeId;
            document.getElementById('edit-node-tag').value = node.tag || "";
            document.getElementById('edit-node-bg').value = node.bgImage || "";
            document.getElementById('edit-node-story').value = node.story || "";

            const choicesList = document.getElementById('edit-choices-list');
            choicesList.innerHTML = '';

            if (node.choices) {
                node.choices.forEach((choice, index) => {
                    choicesList.appendChild(createChoiceRowHTML(choice.text, choice.targetId, index));
                });
            }
        }

        function uploadLocalImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 2.5 * 1024 * 1024) {
                showModal("提示", "此圖片偏大，轉成代碼後可能讓備份檔案變肥，但仍可正常使用！", [
                    { text: "我知道了", onClick: () => hideModal() }
                ]);
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                document.getElementById('edit-node-bg').value = base64Data;
                const bgElement = document.getElementById('game-bg');
                bgElement.style.backgroundImage = `url('${base64Data}')`;
                showNotification("📷 本地圖片已暫存，請按下方儲存儲存！");
            };
            reader.readAsDataURL(file);
        }

        function setPresetBg(key) {
            const url = presetBgs[key];
            if (url) {
                document.getElementById('edit-node-bg').value = url;
                const bgElement = document.getElementById('game-bg');
                bgElement.style.backgroundImage = `url('${url}')`;
            }
        }

        function createChoiceRowHTML(text, targetId, index) {
            const div = document.createElement('div');
            div.className = "bg-gray-800/85 p-2.5 rounded border border-gray-700 flex flex-col space-y-1.5 choice-row shadow-sm";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[9px] text-amber-500 font-bold">按鈕選項 ${index + 1}</span>
                    <button onclick="deleteChoiceRow(this)" class="text-red-400 text-[10px] hover:text-red-300">❌ 刪除</button>
                </div>
                <div>
                    <input type="text" class="choice-text w-full bg-gray-900 border border-gray-750 rounded p-1.5 text-xs text-gray-200" placeholder="按鈕文字（少字為主）" value="${escapeHtml(text)}">
                </div>
                <div class="flex space-x-1 items-center">
                    <span class="text-[9px] text-gray-400 shrink-0">按下後跳轉至:</span>
                    <select class="choice-target w-full bg-gray-900 border border-gray-750 rounded p-1 text-[11px] text-amber-300">
                        ${generateTargetOptions(targetId)}
                    </select>
                </div>
            `;
            return div;
        }

        function generateTargetOptions(selectedId) {
            let options = '';
            Object.keys(gameData).forEach(id => {
                const isSelected = id === selectedId ? 'selected' : '';
                options += `<option value="${id}" ${isSelected}>${id} (${gameData[id].tag || '無標題'})</option>`;
            });
            options += `<option value="__modal_trigger__">+ ➕ 新建其他關卡頁面...</option>`;
            return options;
        }

        function addChoiceRow() {
            const list = document.getElementById('edit-choices-list');
            const rowCount = list.getElementsByClassName('choice-row').length;
            const defaultTarget = Object.keys(gameData)[0] || "start";
            
            const newRow = createChoiceRowHTML("", defaultTarget, rowCount);
            list.appendChild(newRow);

            const select = newRow.querySelector('.choice-target');
            select.onchange = function() {
                if (this.value === "__modal_trigger__") {
                    this.value = "start"; // 先復原
                    openCreatePageModal(); // 改用精美的內建視窗
                }
            };
        }

        function deleteChoiceRow(btn) {
            const row = btn.closest('.choice-row');
            row.remove();
            const list = document.getElementById('edit-choices-list');
            const rows = list.getElementsByClassName('choice-row');
            Array.from(rows).forEach((r, idx) => {
                r.querySelector('span').innerText = `按鈕選項 ${idx + 1}`;
            });
        }

        function openCreatePageModal() {
            document.getElementById('modal-new-id').value = '';
            document.getElementById('modal-new-tag').value = '';
            document.getElementById('create-page-modal').classList.remove('hidden');
        }

        function closeCreatePageModal() {
            document.getElementById('create-page-modal').classList.add('hidden');
        }

        // 建立新頁面
        function submitCreatePage() {
            const rawId = document.getElementById('modal-new-id').value;
            const rawTag = document.getElementById('modal-new-tag').value;

            if (!rawId || !rawTag) {
                showModal("注意", "請填寫完兩個欄位才能新增喔！");
                return;
            }

            const cleanId = rawId.trim().replace(/\s+/g, '_');
            const cleanTag = rawTag.trim();

            if (gameData[cleanId]) {
                showModal("提示", `此頁面 ID 【${cleanId}】 已經存在！請使用其他代碼。`);
                return;
            }

            gameData[cleanId] = {
                tag: cleanTag,
                bgImage: presetBgs.kinmen_old,
                story: `這裡是【${cleanTag}】故事線的全新頁面！您可以在此處編輯豐富的冒險情境...`,
                choices: []
            };

            saveToLocalStorage();
            closeCreatePageModal();
            renderNode(cleanId);
            
            showNotification(`🎉 成功建立新頁面【${cleanTag}】！`);
        }

        // 暫存修改到當前記憶體
        function saveCurrentNodeChanges() {
            const id = document.getElementById('edit-node-id').value;
            if (!id || !gameData[id]) return;

            const tag = document.getElementById('edit-node-tag').value.trim();
            const bgImage = document.getElementById('edit-node-bg').value.trim();
            const story = document.getElementById('edit-node-story').value;

            const choices = [];
            const rows = document.getElementsByClassName('choice-row');
            
            for (let i = 0; i < rows.length; i++) {
                const text = rows[i].querySelector('.choice-text').value.trim();
                const targetId = rows[i].querySelector('.choice-target').value;
                
                if (text && targetId && targetId !== "__modal_trigger__") {
                    choices.push({ text, targetId });
                }
            }

            gameData[id].tag = tag;
            gameData[id].bgImage = bgImage;
            gameData[id].story = story;
            gameData[id].choices = choices;

            saveToLocalStorage();
            renderNode(id);
            
            showNotification("💾 本關卡修改成功，已套用至暫存記憶體！");
        }

        // 寫入本地存檔
        function saveToLocalStorage() {
            try {
                localStorage.setItem('kinmen_rpg_custom_data_v2', JSON.stringify(gameData));
            } catch(e) {
                console.warn("快取寫入受限，但當前遊戲進度仍儲存在網頁記憶體中！");
            }
        }

        // 【儲存的核心函數】：打包含編輯器的完整版
        function getUpdatedHtmlSource() {
            let html = document.documentElement.outerHTML;
            const serializedData = JSON.stringify(gameData, null, 4);
            
            let cleanHtml = "<!DOCTYPE html>\n" + html;
            
            // 替換代碼內的預設劇本 gameData 物件
            cleanHtml = cleanHtml.replace(/let gameData = \{[\s\S]*?\};\s*let currentNodeId/g, `let gameData = ${serializedData};\n        let currentNodeId`);
            
            // 確保別人打開時是從第一頁 intro 開始玩，且編輯器預設關閉
            cleanHtml = cleanHtml.replace(/let currentNodeId = "[^"]*";/g, 'let currentNodeId = "intro";');
            cleanHtml = cleanHtml.replace(/isEditMode = true;/g, 'isEditMode = false;');
            
            // 恢復 HTML 元件的起始 class，避免抽屜被固定打開
            cleanHtml = cleanHtml.replace(/id="editor-drawer" class="([^"]*)"/g, 'id="editor-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[440px] bg-gray-900/98 border-l border-amber-500/20 shadow-2xl z-40 transform translate-x-full transition-transform duration-300 ease-in-out backdrop-blur-lg flex flex-col justify-between hidden"');
            cleanHtml = cleanHtml.replace(/id="custom-modal" class="([^"]*)"/g, 'id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 hidden"');
            cleanHtml = cleanHtml.replace(/id="create-page-modal" class="([^"]*)"/g, 'id="create-page-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 hidden"');
            cleanHtml = cleanHtml.replace(/id="edit-btn-text">[^<]*<\/span>/g, 'id="edit-btn-text">⚙️ 進入編輯器</span>');

            return cleanHtml;
        }

        // 【新增核心功能】：自動移除所有編輯器 UI，產出「純遊玩版」代碼
        function getPlayOnlyHtmlSource() {
            // 利用 DOMParser 安全複製一份當前的 DOM 樹，不影響正在使用的網頁
            const parser = new DOMParser();
            const docClone = parser.parseFromString(document.documentElement.outerHTML, "text/html");

            // --- 開始物理移除所有與編輯器相關的 HTML 元件 ---
            
            // 1. 移除頂部的「進入編輯器」按鈕
            const toggleBtn = docClone.getElementById('btn-toggle-edit');
            if(toggleBtn) toggleBtn.remove();

            // 2. 移除整個側邊的「編輯器抽屜」
            const drawer = docClone.getElementById('editor-drawer');
            if(drawer) drawer.remove();

            // 3. 移除「新增關卡」的彈出視窗
            const createModal = docClone.getElementById('create-page-modal');
            if(createModal) createModal.remove();

            // ---------------------------------------------------

            const serializedData = JSON.stringify(gameData, null, 4);
            let cleanHtml = "<!DOCTYPE html>\n" + docClone.documentElement.outerHTML;

            // 替換代碼內的預設劇本 gameData 物件為最新進度
            cleanHtml = cleanHtml.replace(/let gameData = \{[\s\S]*?\};\s*let currentNodeId/g, `let gameData = ${serializedData};\n        let currentNodeId`);
            
            // 確保純遊玩版強制從 intro 開始
            cleanHtml = cleanHtml.replace(/let currentNodeId = "[^"]*";/g, 'let currentNodeId = "intro";');
            cleanHtml = cleanHtml.replace(/let isEditMode = false;/g, 'let isEditMode = false;');

            return cleanHtml;
        }

        // 下載：匯出純遊玩乾淨版 (Play-Only)
        function downloadPlayOnlyHtmlFile() {
            saveCurrentNodeChanges(); // 匯出前先存檔
            const cleanSource = getPlayOnlyHtmlSource();
            
            try {
                const blob = new Blob([cleanSource], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = "金生金世_純遊玩版.html"; // 下載檔名區分
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showModal("🎮 匯出成功！", "『金生金世_純遊玩版.html』已成功下載！\n\n這個版本已經徹底刪除了編輯器和編輯按鈕。你可以放心地把這個檔案傳給同學、老師，或者上傳到網路上，別人點開就只能玩，絕對無法修改你的故事！");
            } catch (err) {
                // 如果被沙盒阻擋，秀出代碼讓玩家手動複製
                showModalWithCode("⚠️ 直接下載被阻擋", "請直接複製下方的【純遊玩版】代碼，並另存為 index.html：", cleanSource);
            }
        }

        // 下載：含編輯器的完整版 (Dev)
        function downloadUpdatedHtmlFile() {
            saveCurrentNodeChanges();
            const cleanSource = getUpdatedHtmlSource();
            
            try {
                const blob = new Blob([cleanSource], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = "index.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showModal("📥 下載成功！", "『index.html』完整編輯版已成功下載。");
            } catch (err) {
                showModalWithCode("⚠️ 直接下載被阻擋", "請直接複製下方的【完整編輯版】代碼：", cleanSource);
            }
        }

        // 複製代碼 (完整版)
        function copyUpdatedHtmlToClipboard() {
            saveCurrentNodeChanges(); 
            const cleanSource = getUpdatedHtmlSource();
            const textarea = document.createElement('textarea');
            textarea.value = cleanSource;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showModal("🎉 複製成功！", "最新完整版程式碼已複製到剪貼簿。");
            } catch (err) {
                showModal("複製失敗", "瀏覽器阻擋了複製。");
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // 匯出 JSON
        function exportGameData() {
            const dataStr = JSON.stringify(gameData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "金生金世_遊戲自訂備份.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showModal("備份成功！", "自訂數據 .json 檔已下載！");
        }

        // 匯入 JSON
        function importGameDataPrompt() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const importedData = JSON.parse(evt.target.result);
                        if (typeof importedData === 'object' && importedData["start"]) {
                            gameData = importedData;
                            saveToLocalStorage();
                            restartGame();
                            showModal("還原成功！", "已成功載入您的全部自訂劇本與圖片！");
                        } else {
                            showModal("格式錯誤", "請上傳正確的備份 .json 檔！");
                        }
                    } catch(err) {
                        showModal("還原失敗", "檔案解析失敗。");
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // 增強型 Modal (加入程式碼手動選取複製功能)
        function showModalWithCode(title, bodyText, rawCode) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            
            const bodyEl = document.getElementById('modal-body');
            bodyEl.innerHTML = `<div>${bodyText.replace(/\n/g, '<br>')}</div>`;
            
            const textarea = document.createElement('textarea');
            textarea.className = "w-full h-40 bg-gray-950 border border-gray-800 rounded p-2 text-[10px] font-mono mt-3 text-amber-100 select-all focus:outline-none";
            textarea.value = rawCode;
            textarea.setAttribute('readonly', 'readonly');
            textarea.onclick = function() { this.select(); }; // 點擊自動全選
            bodyEl.appendChild(textarea);

            const actionsEl = document.getElementById('modal-actions');
            actionsEl.innerHTML = '';
            
            const btnCopy = document.createElement('button');
            btnCopy.className = "bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition";
            btnCopy.innerText = "📋 點我一鍵複製";
            btnCopy.onclick = function() {
                textarea.select();
                document.execCommand('copy');
                showNotification("🎉 代碼已成功複製！");
            };
            actionsEl.appendChild(btnCopy);

            const btnClose = document.createElement('button');
            btnClose.className = "bg-gray-800 hover:bg-gray-750 text-gray-300 px-4 py-1.5 rounded-lg text-xs transition";
            btnClose.innerText = "關閉";
            btnClose.onclick = hideModal;
            actionsEl.appendChild(btnClose);

            modal.classList.remove('hidden');
        }

        function showModal(title, bodyText, actions = []) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = bodyText;

            const actionsEl = document.getElementById('modal-actions');
            actionsEl.innerHTML = '';

            if (actions.length === 0) {
                actions = [{ text: "確定", onClick: () => hideModal(), isPrimary: true }];
            }

            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = act.isPrimary 
                    ? "bg-amber-600 hover:bg-amber-700 text-black px-4 py-1.5 rounded-lg text-xs font-bold transition"
                    : "bg-gray-800 hover:bg-gray-750 text-gray-300 px-4 py-1.5 rounded-lg text-xs transition";
                btn.innerText = act.text;
                btn.onclick = act.onClick || hideModal;
                actionsEl.appendChild(btn);
            });

            modal.classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function showNotification(msg) {
            const div = document.createElement('div');
            div.className = "fixed bottom-28 left-1/2 transform -translate-x-1/2 bg-amber-600 text-black text-[11px] font-bold py-2.5 px-4 rounded-full shadow-2xl z-50 text-center max-w-[80%] animate-pulse";
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => { div.remove(); }, 4000);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
